version: '3.8'

services:
  db:
    image: postgres:15
    container_name: computeagent-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: computeagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: computeagent-redis
    ports:
      - "6379:6379"

  web:
    build: ./backend
    container_name: computeagent-web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://admin:secret@db:5432/computeagent"
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - ./backend/.env
    volumes:
      - shared_workspaces:/app/workspaces  # <--- CHANGED
    depends_on:
      - db
      - redis


  frontend:
    build: ./frontend
    container_name: computeagent-frontend
    ports:
      - "5173:80"
    depends_on:
      - web

  worker:
    build: ./backend
    container_name: computeagent-worker
    command: ["uv", "run", "celery", "-A", "worker.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: "postgresql+psycopg://admin:secret@db:5432/computeagent"
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shared_workspaces:/app/workspaces  # <--- CHANGED
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  shared_workspaces:
    name: shared_workspaces  # <--- EXPLICITLY NAMED SO PYTHON CAN FIND IT